<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css"><title>ZeitimGriff</title></head>
<body>
<header><div><small>ARBEITSZEIT</small><h1>ZeitimGriff</h1></div><button id="personBtn">Person</button></header>
<nav class="view-tabs">
  <button id="tabMine" class="view-tab active">Meine Zeit</button>
  <button id="tabOverview" class="view-tab">Übersicht</button>
</nav>
<main>
<section class="card hero"><div class="row"><div><div class="section-kicker">HEUTE</div><b>Aktuelle Arbeitszeit</b><div id="date"></div></div><span id="delta">± 0:00</span></div>
<div id="today" class="big">0:00</div><div class="bar"><i id="fill"></i></div>
<div class="row meta"><span id="target">Soll 8:30</span><span id="status">Nicht am Arbeiten</span></div>
<div class="actions"><button id="toggle">▶ Start</button><button id="manual">＋ Zeit eintragen</button></div></section>
<section class="stats"><div class="card"><small>WOCHENTOTAL</small><strong id="week">0:00</strong><div id="weekDelta"></div></div>
<div class="card"><small>TAGESDURCHSCHNITT</small><strong id="avg">0:00</strong><div>Mo–Fr</div></div></section>
<section id="overviewCard" class="card overview hidden"><div class="row"><div><b>Alle Personen</b><div>Gemeinsame Übersicht</div></div></div><div id="overview"></div></section><section class="card week"><div class="row"><div><div class="section-kicker">WOCHE</div><b>Wochenübersicht</b><div id="range"></div></div></div><div id="days"></div></section>
</main>
<div id="sheet" class="overlay hidden"><div class="sheet"><h2>Wer bist du?</h2><p>Die Zeiten werden pro Person getrennt gespeichert.</p><div id="people"></div></div></div>
<div id="manualSheet" class="overlay hidden"><div class="sheet"><h2>Zeit eintragen</h2><label>Datum<input id="mDate" type="date"></label><div class="grid"><label>Von<input id="mStart" type="time"></label><label>Bis<input id="mEnd" type="time"></label></div><div class="actions"><button id="cancel">Abbrechen</button><button id="saveManual">Speichern</button></div></div></div>
<script src="firebase-config.js"></script><script type="module" src="app.js"></script></body></html>
